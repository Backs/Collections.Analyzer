name: Build, Tests and Publish

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.x

    - name: Restore dependencies
      run: dotnet restore Collections.Analyzer.sln

    - name: Build Analyzer
      run: dotnet build Collections.Analyzer/Collections.Analyzer.csproj --configuration Release

    - name: Build CodeFixes
      run: dotnet build Collections.Analyzer.CodeFixes/Collections.Analyzer.CodeFixes.csproj --configuration Release

    - name: Test
      run: dotnet test --configuration Release --verbosity normal

    - name: Pack
      run: dotnet pack Collections.Analyzer/Collections.Analyzer.csproj --configuration Release --no-build --output nupkgs

    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: Backs

    - name: Push to NuGet
      if: github.event_name == 'push'
      run: dotnet nuget push nupkgs/*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
